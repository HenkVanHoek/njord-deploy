# status: "tested"
# last_tested_version: "latest"
# platform_notes: "Tested on Proxmox LXC: docker (latest, 2026-08-15), podman (latest, 2026-08-15); Proxmox VM: docker (latest, 2026-08-15), podman (latest, 2026-08-15)."
# breaking_changes: "None"
services:
  matrix-conduit:
    container_name: njorddeploy-conduit
    image: matrixconduit/matrix-conduit:{{ component_version }}
    restart: unless-stopped
    ports:
      - "{{ PORT_CONDUIT | default(6167) }}:6167"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/conduit:/var/lib/matrix-conduit"
    environment:
      - "CONDUIT_CONFIG="
      - "CONDUIT_DATABASE_PATH=/var/lib/matrix-conduit"
      - "CONDUIT_SERVER_NAME={{ CONDUIT_SERVER_NAME | default('conduit.local') }}"
      - "CONDUIT_DATABASE_BACKEND=rocksdb"
      - "CONDUIT_PORT=6167"
      - "CONDUIT_ALLOW_REGISTRATION=true"
      - "CONDUIT_ALLOW_FEDERATION=true"
      - "CONDUIT_MAX_REQUEST_SIZE=20000000"
      - "CONDUIT_TRUSTED_SERVERS=[\"matrix.org\"]"
      - "PUID={{ PUID | default('1000') }}"
      - "PGID={{ PGID | default('1000') }}"
      - "TZ={{ TZ | default('Europe/Amsterdam') }}"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
