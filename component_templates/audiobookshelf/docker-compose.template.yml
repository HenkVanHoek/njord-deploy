# status: "tested"
# last_tested_version: "2.36.0"
# platform_notes: "Tested on Proxmox LXC: docker (2.36.0, 2026-08-15), podman (2.36.0, 2026-08-15); Proxmox VM: docker (2.36.0, 2026-08-15), podman (2.36.0, 2026-08-15)."
# breaking_changes: none
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:{{ component_version | default('latest') }}
    container_name: njorddeploy-audiobookshelf
    ports:
      - "{{ AUDIOBOOKSHELF_PORT | default('13378') }}:80"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/audiobookshelf/audiobooks:/audiobooks"
      - "{{ CONFIG_BASE_PATH }}/audiobookshelf/podcasts:/podcasts"
      - "{{ CONFIG_BASE_PATH }}/audiobookshelf/metadata:/metadata"
      - "{{ CONFIG_BASE_PATH }}/audiobookshelf/config:/config"
    environment:
      - "PUID={{ PUID | default('1000') }}"
      - "PGID={{ PGID | default('1000') }}"
      - "TZ={{ TZ | default('Europe/Amsterdam') }}"
    restart: unless-stopped
    networks:
      - njorddeploy_net
networks:
  njorddeploy_net:
    external: true
