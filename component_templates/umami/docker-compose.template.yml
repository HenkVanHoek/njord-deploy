# status: "tested"
# last_tested_version: "1.19"
# platform_notes: "Tested on Proxmox LXC: docker (22.23.2, 2026-08-28), podman (1.19, 2026-08-28); Proxmox VM: docker (22.23.2, 2026-08-28), podman (postgresql-latest, 2026-08-28)."
# breaking_changes: "None"
services:
  umami:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-umami
    restart: unless-stopped
    user: "0:0"
    ports:
      - "{{ UMAMI_WEB_PORT }}:3000"
    environment:
      - "DATABASE_URL=postgresql://{{ POSTGRES_USER }}:{{ POSTGRES_PASSWORD }}@njorddeploy-umami-db:5432/{{ POSTGRES_DB }}"
      - "APP_SECRET={{ UMAMI_APP_SECRET }}"
    depends_on:
      njorddeploy-umami-db:
        condition: service_healthy
    networks:
      - njorddeploy_net

  njorddeploy-umami-db:
    image: postgres:15-alpine
    container_name: njorddeploy-umami-db
    restart: unless-stopped
    user: "0:0"
    environment:
      - "POSTGRES_DB={{ POSTGRES_DB }}"
      - "POSTGRES_USER={{ POSTGRES_USER }}"
      - "POSTGRES_PASSWORD={{ POSTGRES_PASSWORD }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/umami/db:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ POSTGRES_USER }} -d {{ POSTGRES_DB }}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
