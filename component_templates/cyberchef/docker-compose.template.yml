services:
  cyberchef:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-cyberchef
    restart: unless-stopped
    ports:
      - "{{ CYBERCHEF_WEB_PORT }}:8000"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
