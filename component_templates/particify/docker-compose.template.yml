# status: "tested"
# last_tested_version: "3.14.20261123"
# platform_notes: "Tested on Proxmox LXC: docker (3.14.20261123, 2026-11-25)."
# breaking_changes: "None"
services:
  particify:
    image: particify/arsnova-proxy:3
    container_name: njorddeploy-particify
    restart: unless-stopped
    ports:
      - "{{ PARTICIFY_WEB_PORT | default('8123', true) }}:80"
    environment:
      ARSNOVA_HOSTNAME: "{{ PARTICIFY_HOSTNAME | default('localhost', true) }}"
      CSP_FRAME_ANCESTORS: "{{ PARTICIFY_CSP_FRAME_ANCESTORS | default('', true) }}"
    depends_on:
      - arsnova-backend-core
      - arsnova-auth-service
      - arsnova-ws-gateway
      - arsnova-http-gateway
      - arsnova-comment-service
      - arsnova-web
    networks:
      - njorddeploy_net
      - particify_internal

  arsnova-web:
    image: particify/arsnova-webclient:{{ component_version if (component_version and component_version != 'latest') else '3.14.20261123' }}
    container_name: njorddeploy-particify-web
    restart: unless-stopped
    networks:
      - particify_internal

  arsnova-backend-core:
    image: particify/arsnova-server-core:{{ component_version if (component_version and component_version != 'latest') else '3.14.20261123' }}
    container_name: njorddeploy-particify-core
    restart: unless-stopped
    depends_on:
      particify-couchdb:
        condition: service_healthy
      particify-rabbitmq:
        condition: service_healthy
    environment:
      SYSTEM_ROOTURL: "{{ PARTICIFY_ROOT_URL | default('http://localhost:8123', true) }}"
      SYSTEM_API_PROXYPATH: "/api"
      SYSTEM_SOCKETIO_BINDADDRESS: "0.0.0.0"
      SYSTEM_COUCHDB_HOST: "particify-couchdb"
      SYSTEM_COUCHDB_USERNAME: "arsnova"
      SYSTEM_COUCHDB_PASSWORD: "{{ PARTICIFY_DB_PASSWORD }}"
      SYSTEM_COUCHDB_CREATEDB: "true"
      SYSTEM_MESSAGE_BROKER_RABBITMQ_ENABLED: "true"
      SYSTEM_MESSAGE_BROKER_RABBITMQ_HOST: "particify-rabbitmq"
      SYSTEM_MESSAGE_BROKER_RABBITMQ_USERNAME: "guest"
      SYSTEM_MESSAGE_BROKER_RABBITMQ_PASSWORD: "guest"
      SYSTEM_MESSAGE_BROKER_RABBITMQ_VIRTUAL_HOST: "/"
      SYSTEM_MAIL_HOST: "{{ PARTICIFY_MAIL_HOST | default('', true) }}"
      SYSTEM_MAIL_PORT: "{{ PARTICIFY_MAIL_PORT | default('25', true) }}"
      SYSTEM_MAIL_IMPLICITTLS: "{{ PARTICIFY_MAIL_IMPLICITTLS | default('false', true) }}"
      SYSTEM_MAIL_USERNAME: "{{ PARTICIFY_MAIL_USERNAME | default('', true) }}"
      SYSTEM_MAIL_PASSWORD: "{{ PARTICIFY_MAIL_PASSWORD | default('', true) }}"
      SYSTEM_MAIL_SENDERNAME: "{{ PARTICIFY_MAIL_SENDERNAME | default('Particify', true) }}"
      SYSTEM_MAIL_SENDERADDRESS: "{{ PARTICIFY_MAIL_SENDERADDRESS | default('particify@example.com', true) }}"
      SYSTEM_FORMATTING_SERVICE_HOST_URL: "http://arsnova-formatting-service:3000"
      SECURITY_JWT_SECRET: "{{ PARTICIFY_JWT_SECRET }}"
      SECURITY_JWT_SERVER_ID: "arsnova.backend.v3:{{ PARTICIFY_HOSTNAME | default('localhost', true) }}"
      SECURITY_AUTHENTICATIONPROVIDERS_GUEST_ENABLED: "{{ PARTICIFY_GUEST_ENABLED | default('true', true) }}"
      SECURITY_AUTHENTICATIONPROVIDERS_GUEST_ALLOWEDROLES: "{{ PARTICIFY_GUEST_ALLOWED_ROLES | default('participant', true) }}"
      SECURITY_AUTHENTICATIONPROVIDERS_REGISTERED_TITLE: "{{ PARTICIFY_AUTH_TITLE | default('Particify', true) }}"
      SECURITY_AUTHENTICATIONPROVIDERS_REGISTERED_ALLOWEDEMAILDOMAINS: "{{ PARTICIFY_ALLOWED_EMAIL_DOMAINS | default('*', true) }}"
    networks:
      - particify_internal

  arsnova-http-gateway:
    image: particify/arsnova-server-gateway:{{ component_version if (component_version and component_version != 'latest') else '3.14.20261123' }}
    container_name: njorddeploy-particify-http-gateway
    restart: unless-stopped
    depends_on:
      particify-rabbitmq:
        condition: service_healthy
      arsnova-auth-service:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      ROUTING_ENDPOINTS_CORE: "http://arsnova-backend-core:8080"
      ROUTING_ENDPOINTS_WS_GATEWAY: "http://arsnova-ws-gateway:8080"
      ROUTING_ENDPOINTS_COMMENT_SERVICE: "http://arsnova-comment-service:8080"
      ROUTING_ENDPOINTS_ROOMACCESS_SERVICE: "http://arsnova-auth-service:8080"
      ROUTING_ENDPOINTS_FORMATTING_SERVICE: "http://arsnova-formatting-service:3000"
      HTTP_CLIENT_AUTH_SERVICE: "http://arsnova-auth-service:8080"
      HTTP_CLIENT_CORE: "http://arsnova-backend-core:8080"
      HTTP_CLIENT_WS_GATEWAY: "http://arsnova-ws-gateway:8080"
      HTTP_CLIENT_COMMENT_SERVICE: "http://arsnova-comment-service:8080"
      SECURITY_JWT_PUBLIC_SECRET: "{{ PARTICIFY_JWT_SECRET }}"
      SECURITY_JWT_INTERNAL_SECRET: "{{ PARTICIFY_JWT_SECRET }}"
      SECURITY_JWT_SERVER_ID: "arsnova.backend.v3:{{ PARTICIFY_HOSTNAME | default('localhost', true) }}"
    networks:
      - particify_internal

  arsnova-ws-gateway:
    image: particify/arsnova-server-websocket:{{ component_version if (component_version and component_version != 'latest') else '3.14.20261123' }}
    container_name: njorddeploy-particify-ws-gateway
    restart: unless-stopped
    depends_on:
      particify-rabbitmq:
        condition: service_healthy
      arsnova-auth-service:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      STOMP_RELAY_HOST: "particify-rabbitmq"
      STOMP_RELAY_USER: "guest"
      STOMP_RELAY_PASSWORD: "guest"
      HTTP_CLIENT_AUTH_SERVICE: "http://arsnova-auth-service:8080"
      SECURITY_JWT_SECRET: "{{ PARTICIFY_JWT_SECRET }}"
      RABBITMQ_HOST: "particify-rabbitmq"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_PASSWORD: "guest"
    networks:
      - particify_internal

  arsnova-auth-service:
    image: particify/arsnova-server-authz:{{ component_version if (component_version and component_version != 'latest') else '3.14.20261123' }}
    container_name: njorddeploy-particify-auth
    restart: unless-stopped
    depends_on:
      particify-postgres-auth:
        condition: service_healthy
      particify-rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://particify-postgres-auth:5432/arsnovaauth"
      SPRING_DATASOURCE_USERNAME: "arsnovaauth"
      SPRING_DATASOURCE_PASSWORD: "{{ PARTICIFY_DB_PASSWORD }}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      RABBITMQ_HOST: "particify-rabbitmq"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_PASSWORD: "guest"
      SECURITY_JWT_SECRET: "{{ PARTICIFY_JWT_SECRET }}"
      SECURITY_JWT_SERVER_ID: "arsnova.backend.v3:{{ PARTICIFY_HOSTNAME | default('localhost', true) }}"
    networks:
      - particify_internal

  arsnova-comment-service:
    image: particify/arsnova-server-comments:{{ component_version if (component_version and component_version != 'latest') else '3.14.20261123' }}
    container_name: njorddeploy-particify-comment
    restart: unless-stopped
    depends_on:
      particify-postgres-comment:
        condition: service_healthy
      particify-rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://particify-postgres-comment:5432/arsnovacomment"
      SPRING_DATASOURCE_USERNAME: "arsnovacomment"
      SPRING_DATASOURCE_PASSWORD: "{{ PARTICIFY_DB_PASSWORD }}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_RABBITMQ_HOST: "particify-rabbitmq"
      SPRING_RABBITMQ_USERNAME: "guest"
      SPRING_RABBITMQ_PASSWORD: "guest"
      SECURITY_JWT_SECRET: "{{ PARTICIFY_JWT_SECRET }}"
    networks:
      - particify_internal

  arsnova-formatting-service:
    image: particify/arsnova-server-formatting:{{ component_version if (component_version and component_version != 'latest') else '3.14.20261123' }}
    container_name: njorddeploy-particify-formatting
    restart: unless-stopped
    environment:
      SERVER_PORT: "3000"
    networks:
      - particify_internal

  particify-couchdb:
    image: particify/couchdb:3.5
    container_name: njorddeploy-particify-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: "arsnova"
      COUCHDB_PASSWORD: "{{ PARTICIFY_DB_PASSWORD }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/particify/couchdb:/opt/couchdb/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5984/_up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - particify_internal

  particify-postgres-auth:
    image: postgres:17-alpine
    container_name: njorddeploy-particify-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: "arsnovaauth"
      POSTGRES_USER: "arsnovaauth"
      POSTGRES_PASSWORD: "{{ PARTICIFY_DB_PASSWORD }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/particify/postgres-auth:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsnovaauth -d arsnovaauth"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - particify_internal

  particify-postgres-comment:
    image: postgres:17-alpine
    container_name: njorddeploy-particify-postgres-comment
    restart: unless-stopped
    environment:
      POSTGRES_DB: "arsnovacomment"
      POSTGRES_USER: "arsnovacomment"
      POSTGRES_PASSWORD: "{{ PARTICIFY_DB_PASSWORD }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/particify/postgres-comment:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsnovacomment -d arsnovacomment"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - particify_internal

  particify-rabbitmq:
    # Upstream arsnova-server-websocket omits setSystemLogin/setSystemPasscode in
    # WebSocketConfig.kt, so Spring StompBrokerRelay always authenticates its _system_
    # session as 'guest'. RabbitMQ is strictly isolated on particify_internal (no host ports).
    image: particify/rabbitmq-stomp:4.4-alpine
    container_name: njorddeploy-particify-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: "rabbit@localhost"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/particify/rabbitmq:/var/lib/rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - particify_internal

networks:
  njorddeploy_net:
    external: true
  particify_internal:
    name: particify_internal
