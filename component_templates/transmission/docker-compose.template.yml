# status: "tested"
# last_tested_version: "4.1.3-r0-ls361"
# platform_notes: "Tested on Proxmox LXC: docker (4.1.3-r0-ls361, 2026-09-14), podman (4.1.3-r0-ls361, 2026-09-14); Proxmox VM: docker (4.1.3-r0-ls361, 2026-09-14), podman (4.1.3-r0-ls361, 2026-09-14)."
# breaking_changes: none
services:
  transmission:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-transmission
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    ports:
      - "{{ TRANSMISSION_WEB_PORT }}:9091"
      - "51413:51413"
      - "51413:51413/udp"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/transmission/config:/config"
      - "{{ CONFIG_BASE_PATH }}/transmission/downloads:/downloads"
      - "{{ CONFIG_BASE_PATH }}/transmission/watch:/watch"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
