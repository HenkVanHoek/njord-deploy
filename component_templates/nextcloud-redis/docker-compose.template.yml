# status: "tested"
# last_tested_version: "8.10.1"
# platform_notes: "Tested on Proxmox LXC: docker (8.10.1, 2026-09-05), podman (8.10.1, 2026-09-05); Proxmox VM: docker (8.10.1, 2026-09-04), podman (8.10.1, 2026-09-05)."
# breaking_changes: "None"
services:
  nextcloud-redis:
    image: redis:{{ component_version if component_version != 'latest' else 'alpine' }}
    container_name: nextcloud-redis
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      TZ: "{{ TZ }}"
    networks:
      - njorddeploy_net
      - nextcloud-internal

networks:
  njorddeploy_net:
    external: true
  nextcloud-internal:
    name: nextcloud-internal
