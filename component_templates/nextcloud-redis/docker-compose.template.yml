# status: "tested"
# last_tested_version: "latest"
# platform_notes: "Tested successfully on Proxmox LXC."
# breaking_changes: "None"
services:
  nextcloud-redis:
    image: redis:{{ component_version }}
    container_name: nextcloud-redis
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      TZ: "{{ TZ }}"
    networks:
      - nextcloud-internal

networks:
  nextcloud-internal:
    name: nextcloud-internal
