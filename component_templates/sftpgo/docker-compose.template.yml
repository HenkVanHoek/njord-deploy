# status: "tested"
# last_tested_version: "v2.7.5"
# platform_notes: "Tested on Proxmox LXC: docker (v2.7.5, 2026-09-14), podman (v2.7.5, 2026-09-14); Proxmox VM: docker (v2.7.5, 2026-09-14), podman (v2.7.5, 2026-09-14)."
# breaking_changes: none
services:
  sftpgo:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-sftpgo
    restart: unless-stopped
    ports:
      - "{{ SFTPGO_WEB_PORT }}:8080"
      - "2022:2022"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/sftpgo/config:/var/lib/sftpgo"
      - "{{ CONFIG_BASE_PATH }}/sftpgo/data:/srv/sftpgo/data"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
