# status: "tested"
# last_tested_version: "24.20.0"
# platform_notes: "Tested on Proxmox LXC: docker (24.20.0, 2026-09-05), podman (24.20.0, 2026-09-04); Proxmox VM: docker (24.20.0, 2026-09-04), podman (24.20.0, 2026-09-04)."
# breaking_changes: none
services:
  actual-budget:
    container_name: njorddeploy-actual-budget
    image: "{{ image_name }}:{{ component_version }}"
    ports:
      - "{{ ACTUAL_BUDGET_WEB_PORT }}:5006"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/actual-budget/data:/data"
    networks:
      - njorddeploy_net
    restart: unless-stopped
    user: "0:0"

networks:
  njorddeploy_net:
    external: true
