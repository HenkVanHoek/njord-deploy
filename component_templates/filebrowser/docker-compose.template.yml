# status: "tested"
# last_tested_version: "2.63.23"
# platform_notes: "Tested on Proxmox LXC: docker (2.63.23, 2026-08-15), podman (2.63.23, 2026-08-15); Proxmox VM: docker (2.63.23, 2026-08-15), podman (2.63.23, 2026-08-15)."
# breaking_changes: "None"
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "0:0"
    restart: unless-stopped
    environment:
      - FB_DATABASE=/database/filebrowser.db
    volumes:
      - "{{ DATA_ROOT }}:/srv"
      - "{{ DATA_ROOT }}/filebrowser/database:/database"
      - "{{ DATA_ROOT }}/filebrowser/config:/config"
    ports:
      - "{{ FILEBROWSER_WEB_PORT }}:80"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
