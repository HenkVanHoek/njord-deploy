# status: "tested"
# last_tested_version: "0.6.27-ls399"
# platform_notes: "Tested on Proxmox LXC: docker (0.6.27-ls399, 2026-09-04), podman (0.6.27-ls399, 2026-09-04); Proxmox VM: docker (0.6.27-ls399, 2026-09-04), podman (0.6.27-ls399, 2026-09-04)."
# breaking_changes: none
services:
  calibre-web:
    container_name: njorddeploy-calibre-web
    image: "{{ image_name }}:{{ component_version }}"
    environment:
      - "PUID={{ PUID }}"
      - "PGID={{ PGID }}"
      - "TZ={{ TZ }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/calibre-web/config:/config"
      - "{{ CONFIG_BASE_PATH }}/calibre-web/books:/books"
    ports:
      - "{{ CALIBRE_WEB_PORT }}:8083"
    user: "0:0"
    restart: unless-stopped
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
