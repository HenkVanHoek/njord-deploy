# status: "tested"
# last_tested_version: "0.19.0"
# platform_notes: "Tested on Proxmox LXC: docker (0.19.0, 2026-09-05), podman (0.19.0, 2026-09-04); Proxmox VM: docker (0.19.0, 2026-09-04), podman (0.19.0, 2026-09-04)."
# breaking_changes: none
services:
  beszel:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-beszel
    restart: unless-stopped
    ports:
      - "{{ BESZEL_WEB_PORT }}:8090"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/beszel/data:/beszel_data"
    user: "0:0"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
