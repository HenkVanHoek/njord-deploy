# status: "tested"
# last_tested_version: "0.10.0"
# platform_notes: "Tested on Proxmox LXC: docker (0.10.0, 2026-11-01), podman (master-omnibus, 2026-09-14); Proxmox VM: docker (master-omnibus, 2026-09-14), podman (master-omnibus, 2026-09-14)."
# breaking_changes: none
services:
  scrutiny:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-scrutiny
    restart: unless-stopped
    privileged: true
    ports:
      - "{{ SCRUTINY_WEB_PORT }}:8080"
    volumes:
      - /run/udev:/run/udev:ro
      - "{{ CONFIG_BASE_PATH }}/scrutiny/config:/opt/scrutiny/config"
      - "{{ CONFIG_BASE_PATH }}/scrutiny/influxdb:/opt/scrutiny/influxdb"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
