# status: "tested"
# last_tested_version: "v2.9.1"
# platform_notes: "Tested on Proxmox LXC: docker (v2.9.1, 2026-09-04); Proxmox VM: docker (v2.9.1, 2026-09-05)."
# breaking_changes: "None"
services:
  fluffychat-web:
    container_name: njorddeploy-fluffychat-web
    image: ghcr.io/krille-chan/fluffychat:{{ component_version | default('latest') }}
    ports:
      - "{{ FLUFFYCHAT_WEB_PORT }}:80"
    environment:
      - "CHAT_MODE={{ CHAT_MODE | default('your-own-domain') }}"
      - "HOMESERVER_DOMAIN={{ HOMESERVER_DOMAIN | default('matrix.org') }}"
    restart: unless-stopped
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
