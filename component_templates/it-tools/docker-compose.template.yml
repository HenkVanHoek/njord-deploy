services:
  it-tools:
    container_name: njorddeploy-it-tools
    image: "{{ image_name }}:{{ component_version }}"
    ports:
      - "{{ IT_TOOLS_WEB_PORT }}:80"
    restart: unless-stopped
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
