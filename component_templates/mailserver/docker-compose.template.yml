# status: "untested"
# last_tested_version: "none"
# platform_notes: "None"
# breaking_changes: "None"
# scripts/templates/nextcloud/docker-compose.template.yml
services:
  nextcloud:
    image: nextcloud:{{ component_version }}
    container_name: njorddeploy-nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - nextcloud_data:/var/www/html
      - nextcloud_config:/var/www/html/config
    environment:
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=njorddeploy
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - NEXTCLOUD_ADMIN_USER=${NC_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NC_ADMIN_PASS}
    depends_on:
      - mariadb
    networks:
      - njorddeploy_net

volumes:
  nextcloud_data:
    name: njorddeploy-nextcloud-data
  nextcloud_config:
    name: njorddeploy-nextcloud-config

networks:
  njorddeploy_net:
    external: true
