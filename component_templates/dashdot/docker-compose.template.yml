# status: "tested"
# last_tested_version: "6.3.4"
# platform_notes: "Tested on Proxmox LXC: docker (6.3.4, 2026-09-14), podman (6.3.4, 2026-09-14); Proxmox VM: docker (6.3.4, 2026-09-14), podman (6.3.4, 2026-09-14)."
# breaking_changes: none
services:
  dashdot:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-dashdot
    restart: unless-stopped
    privileged: true
    ports:
      - "{{ DASHDOT_WEB_PORT }}:3001"
    volumes:
      - /:/mnt/host:ro
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
