# status: "tested"
# last_tested_version: "11.3.1"
# platform_notes: "Tested on Proxmox LXC: docker (11.3.1, 2026-10-11), podman (v11.0.1, 2026-09-14); Proxmox VM: docker (v11.0.1, 2026-09-14), podman (v11.0.1, 2026-09-14)."
# breaking_changes: none
services:
  dozzle:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-dozzle
    restart: unless-stopped
    ports:
      - "{{ DOZZLE_WEB_PORT }}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
