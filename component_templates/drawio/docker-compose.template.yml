services:
  drawio:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-drawio
    restart: unless-stopped
    ports:
      - "{{ DRAWIO_WEB_PORT }}:8080"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
