# status: "tested"
# last_tested_version: "24.04"
# platform_notes: "Tested on Proxmox LXC: docker (24.04, 2026-08-29), podman (24.04, 2026-08-29); Proxmox VM: docker (24.04, 2026-08-29), podman (24.04, 2026-08-29)."
# breaking_changes: none
services:
  drawio:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-drawio
    restart: unless-stopped
    ports:
      - "{{ DRAWIO_WEB_PORT }}:8080"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
