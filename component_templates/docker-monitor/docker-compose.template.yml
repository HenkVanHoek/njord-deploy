# templates/docker-monitor/docker-compose.template.yml
services:
  docker-monitor:
    container_name: njorddeploy-docker-monitor
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - "{{DATA_ROOT}}/docker-monitor/html:/usr/share/nginx/html:ro"
    ports:
      - "8088:80"
    networks:
      - njorddeploy_net
networks:
  njorddeploy_net:
    external: true
