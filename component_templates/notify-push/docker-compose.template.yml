# status: "tested"
# last_tested_version: "8.5.9"
# platform_notes: "Tested on Proxmox LXC: docker (8.5.9, 2026-08-15), podman (10.11.18, 2026-08-15); Proxmox VM: docker (8.5.9, 2026-08-15), podman (8.5.9, 2026-08-15)."
# breaking_changes: "None"
services:
  notify-push:
    image: nextcloud:stable
    container_name: notify-push
    restart: unless-stopped
    depends_on:
      - nextcloud-app
      - nextcloud-db
      - nextcloud-redis
    environment:
      TZ: "{{ TZ }}"
      PORT: "7867"
      NEXTCLOUD_URL: "https://nextcloud.{{ DOMAIN }}"
    volumes:
      - "{{ NEXTCLOUD_DATA_PATH }}:/var/www/html"
    entrypoint:
      - /bin/sh
      - -c
      - |
        ARCH=$$(uname -m)
        if [ "$$ARCH" = "arm64" ] || [ "$$ARCH" = "aarch64" ]; then
            BINARY_ARCH="aarch64"
        elif [ "$$ARCH" = "x86_64" ] || [ "$$ARCH" = "amd64" ]; then
            BINARY_ARCH="x86_64"
        elif [ "$$ARCH" = "armv7l" ] || [ "$$ARCH" = "armv7" ]; then
            BINARY_ARCH="armv7"
        else
            BINARY_ARCH="$$ARCH"
        fi

        BINARY="/var/www/html/custom_apps/notify_push/bin/$$BINARY_ARCH/notify_push"

        if [ -f "$$BINARY" ] && [ -f /var/www/html/config/config.php ]; then
            echo "Starting notify_push for architecture $$BINARY_ARCH..."
            exec "$$BINARY" /var/www/html/config/config.php
        else
            echo "Warning: notify_push binary ($$BINARY) or config.php not found."
            echo "Standby mode active. Waiting for Nextcloud installation and Client Push app activation..."
            while true; do
                sleep 3600
            done
        fi
    networks:
      - njorddeploy_net
      - nextcloud-internal

networks:
  njorddeploy_net:
    external: true
  nextcloud-internal:
    name: nextcloud-internal
