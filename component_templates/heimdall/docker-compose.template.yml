# status: "tested"
# last_tested_version: "v2.8.1-ls356"
# platform_notes: "Tested successfully on Proxmox LXC."
# breaking_changes: "None"
services:
  heimdall:
    container_name: njorddeploy-heimdall
    image: lscr.io/linuxserver/heimdall:{{ component_version }}
    restart: unless-stopped
    ports:
      - "8090:80"
      - "8490:443"
    volumes:
      - "{{DATA_ROOT}}/heimdall/config:/config"
    environment:
      - "PUID={{PUID}}"
      - "PGID={{PGID}}"
      - "TZ={{TZ}}"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
