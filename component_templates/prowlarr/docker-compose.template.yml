# platform_notes: "Tested on Proxmox LXC: docker (2.5.2.5491-ls156, 2026-08-15), podman (2.5.2.5491-ls156, 2026-08-15); Proxmox VM: docker (2.5.2.5491-ls156, 2026-08-15), podman (2.5.2.5491-ls156, 2026-08-15)."
# breaking_changes: none
services:
  prowlarr:
    container_name: njorddeploy-prowlarr
    image: "{{ image_name }}:{{ component_version }}"
    environment:
      - "PUID={{ PUID }}"
      - "PGID={{ PGID }}"
      - "TZ={{ TZ }}"
      - "UMASK_SET=022"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/prowlarr/config:/config"
    ports:
      - "{{ PROWLARR_WEB_PORT }}:9696"
    networks:
      - njorddeploy_net
    restart: unless-stopped
    user: "0:0"

networks:
  njorddeploy_net:
    external: true
