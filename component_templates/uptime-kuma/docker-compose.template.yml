# status: "tested"
# last_tested_version: "18.20.3"
# platform_notes: "Tested on Proxmox LXC: docker (18.20.3, 2026-08-15), podman (18.20.3, 2026-08-15); Proxmox VM: docker (18.20.3, 2026-08-15), podman (18.20.3, 2026-08-15)."
# breaking_changes: "None"
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - "{{ UPTIME_KUMA_DATA_PATH }}:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
      - "{{ UPTIME_KUMA_WEB_PORT }}:3001"
    restart: unless-stopped
