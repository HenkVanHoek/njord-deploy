# status: "untested"
# last_tested_version: "none"
# platform_notes: "None"
# breaking_changes: "None"
services:
  karakeep:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-karakeep
    restart: unless-stopped
    ports:
      - "{{ KARAKEEP_WEB_PORT }}:3000"
    environment:
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - MEILI_MASTER_KEY={{ KARAKEEP_MEILI_MASTER_KEY }}
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      - NEXTAUTH_SECRET={{ KARAKEEP_NEXTAUTH_SECRET }}
      - NEXTAUTH_URL=http://localhost:{{ KARAKEEP_WEB_PORT }}
      - DATA_DIR=/data
    volumes:
      - "{{ CONFIG_BASE_PATH }}/karakeep/data:/data"
    depends_on:
      - karakeep-meilisearch
      - karakeep-chrome
    networks:
      - njorddeploy_net

  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: njorddeploy-karakeep-chrome
    restart: unless-stopped
    networks:
      - njorddeploy_net

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.12.0
    container_name: njorddeploy-karakeep-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY={{ KARAKEEP_MEILI_MASTER_KEY }}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - "{{ CONFIG_BASE_PATH }}/karakeep/meili_data:/meili_data"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
