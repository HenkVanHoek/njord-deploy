# status: "tested"
# last_tested_version: "24.04"
# platform_notes: "Tested on Proxmox LXC: docker (24.04, 2026-09-05), podman (24.04, 2026-09-04); Proxmox VM: docker (24.04, 2026-09-04), podman (24.04, 2026-09-04)."
# breaking_changes: "None"
services:
  ollama:
    container_name: njorddeploy-ollama
    image: "{{ image_name | default('ollama/ollama') }}:{{ component_version | default('latest') }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/ollama/data:/root/.ollama"
    ports:
      - "{{ OLLAMA_PORT | default('11434') }}:11434"
    networks:
      - njorddeploy_net
    tty: true
    restart: unless-stopped

networks:
  njorddeploy_net:
    external: true
