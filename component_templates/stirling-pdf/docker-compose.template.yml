# status: "tested"
# last_tested_version: "3.1.0"
# platform_notes: "Tested on Proxmox LXC: docker (3.1.0, 2026-10-06), podman (2.14.3, 2026-09-14); Proxmox VM: docker (2.14.3, 2026-09-14), podman (2.14.3, 2026-09-14)."
# breaking_changes: none
services:
  stirling-pdf:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-stirling-pdf
    ports:
      - "{{ STIRLING_PDF_HTTP_PORT }}:8080"
    volumes:
      - "{{ DATA_ROOT }}/stirling-pdf/data:/app/data"
    networks:
      - njorddeploy_net
    restart: unless-stopped
networks:
  njorddeploy_net:
    external: true
