# status: "testing"
# last_tested_version: "v4.17.1"
# platform_notes: "Tested on Proxmox LXC: docker (v4.17.1, 2026-09-16)."
# breaking_changes: none

services:
  chatwoot-web:
    image: chatwoot/chatwoot:{{ component_version | default('v4.17.1') }}
    container_name: njorddeploy-chatwoot-web
    restart: always
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    ports:
      - "{{ CHATWOOT_WEB_PORT | default('3044') }}:3000"
    environment:
      - "NODE_ENV=production"
      - "RAILS_ENV=production"
      - "INSTALLATION_ENV=docker"
      - "FRONTEND_URL={{ FRONTEND_URL | default('https://chat.njorddeploy.com') }}"
      - "SECRET_KEY_BASE={{ SECRET_KEY_BASE }}"
      - "POSTGRES_HOST=chatwoot-postgres"
      - "POSTGRES_PORT=5432"
      - "POSTGRES_DATABASE=chatwoot_production"
      - "POSTGRES_USERNAME=chatwoot"
      - "POSTGRES_PASSWORD={{ POSTGRES_PASSWORD }}"
      - "REDIS_URL=redis://:{{ REDIS_PASSWORD }}@chatwoot-redis:6379"
      - "ACTIVE_STORAGE_SERVICE=local"
      - "SMTP_ADDRESS={{ SMTP_ADDRESS | default('smtp.soverin.net') }}"
      - "SMTP_PORT={{ SMTP_PORT | default('587') }}"
      - "SMTP_USERNAME={{ SMTP_USERNAME | default('info@njorddeploy.com') }}"
      - "SMTP_PASSWORD={{ SMTP_PASSWORD }}"
      - "SMTP_DOMAIN={{ SMTP_DOMAIN | default('njorddeploy.com') }}"
      - "SMTP_ENABLE_STARTTLS_AUTO=true"
      - "SMTP_AUTHENTICATION=plain"
      - "MAILER_SENDER_EMAIL={{ MAILER_SENDER_EMAIL | default('info@njorddeploy.com') }}"
      - "SMTP_OPENSSL_VERIFY_MODE=peer"
      - "ENABLE_ACCOUNT_SIGNUP=false"
      - "ENABLE_RACK_ATTACK_WIDGET_API=true"
    volumes:
      - "{{ DATA_ROOT | default('/opt/njorddeploy/data') }}/chatwoot/storage:/app/storage"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      - njorddeploy_net

  chatwoot-worker:
    image: chatwoot/chatwoot:{{ component_version | default('v4.17.1') }}
    container_name: njorddeploy-chatwoot-worker
    restart: always
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    environment:
      - "NODE_ENV=production"
      - "RAILS_ENV=production"
      - "INSTALLATION_ENV=docker"
      - "FRONTEND_URL={{ FRONTEND_URL | default('https://chat.njorddeploy.com') }}"
      - "SECRET_KEY_BASE={{ SECRET_KEY_BASE }}"
      - "POSTGRES_HOST=chatwoot-postgres"
      - "POSTGRES_PORT=5432"
      - "POSTGRES_DATABASE=chatwoot_production"
      - "POSTGRES_USERNAME=chatwoot"
      - "POSTGRES_PASSWORD={{ POSTGRES_PASSWORD }}"
      - "REDIS_URL=redis://:{{ REDIS_PASSWORD }}@chatwoot-redis:6379"
      - "ACTIVE_STORAGE_SERVICE=local"
      - "SMTP_ADDRESS={{ SMTP_ADDRESS | default('smtp.soverin.net') }}"
      - "SMTP_PORT={{ SMTP_PORT | default('587') }}"
      - "SMTP_USERNAME={{ SMTP_USERNAME | default('info@njorddeploy.com') }}"
      - "SMTP_PASSWORD={{ SMTP_PASSWORD }}"
      - "SMTP_DOMAIN={{ SMTP_DOMAIN | default('njorddeploy.com') }}"
      - "SMTP_ENABLE_STARTTLS_AUTO=true"
      - "SMTP_AUTHENTICATION=plain"
      - "MAILER_SENDER_EMAIL={{ MAILER_SENDER_EMAIL | default('info@njorddeploy.com') }}"
      - "SMTP_OPENSSL_VERIFY_MODE=peer"
      - "ENABLE_ACCOUNT_SIGNUP=false"
      - "ENABLE_RACK_ATTACK_WIDGET_API=true"
    volumes:
      - "{{ DATA_ROOT | default('/opt/njorddeploy/data') }}/chatwoot/storage:/app/storage"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    networks:
      - njorddeploy_net

  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    container_name: njorddeploy-chatwoot-postgres
    restart: always
    environment:
      - "POSTGRES_DB=chatwoot_production"
      - "POSTGRES_USER=chatwoot"
      - "POSTGRES_PASSWORD={{ POSTGRES_PASSWORD }}"
    volumes:
      - "{{ DATA_ROOT | default('/opt/njorddeploy/data') }}/chatwoot/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot_production"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - njorddeploy_net

  chatwoot-redis:
    image: redis:7-alpine
    container_name: njorddeploy-chatwoot-redis
    restart: always
    command: ["redis-server", "--requirepass", "{{ REDIS_PASSWORD }}"]
    volumes:
      - "{{ DATA_ROOT | default('/opt/njorddeploy/data') }}/chatwoot/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "{{ REDIS_PASSWORD }}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
