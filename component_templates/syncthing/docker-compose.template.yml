# status: "tested"
# last_tested_version: "v2.1.3"
# platform_notes: "Tested on Proxmox LXC: docker (v2.1.3, 2026-08-29), podman (v2.1.3, 2026-08-29); Proxmox VM: docker (v2.1.3, 2026-08-29), podman (v2.1.3, 2026-08-29)."
# breaking_changes: none
services:
  syncthing:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-syncthing
    hostname: njorddeploy-syncthing
    restart: unless-stopped
    ports:
      - "{{ SYNCTHING_WEB_PORT }}:8384"
      - "{{ SYNCTHING_PORT }}:22000/tcp"
      - "{{ SYNCTHING_PORT }}:22000/udp"
    environment:
      - "PUID=1000"
      - "PGID=1000"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/syncthing/config:/var/syncthing/config"
      - "{{ CONFIG_BASE_PATH }}/syncthing/data:/var/syncthing/data"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
