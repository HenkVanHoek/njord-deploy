# status: "tested"
# last_tested_version: "2.1.2"
# platform_notes: "Tested on Proxmox LXC: docker (2.1.2, 2026-09-14), podman (2.1.2, 2026-09-14); Proxmox VM: docker (2.1.2, 2026-09-14), podman (2.1.2, 2026-09-14)."
# breaking_changes: none
services:
  mosquitto:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-mosquitto
    restart: unless-stopped
    ports:
      - "{{ MOSQUITTO_MQTT_PORT }}:1883"
    volumes:
      - "{{ DATA_ROOT }}/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
      - "{{ CONFIG_BASE_PATH }}/mosquitto/data:/mosquitto/data"
      - "{{ CONFIG_BASE_PATH }}/mosquitto/log:/mosquitto/log"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
