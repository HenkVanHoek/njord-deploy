# status: "untested"
# last_tested_version: "none"
# platform_notes: "None"
# breaking_changes: "None"
services:
  rybbit:
    image: caddy:2-alpine
    container_name: njorddeploy-rybbit
    restart: unless-stopped
    ports:
      - "{{ RYBBIT_WEB_PORT }}:80"
    command:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /etc/caddy/Caddyfile
        :80 {
            encode zstd gzip
            handle /api/* {
                reverse_proxy rybbit-backend:3001
            }
            handle /.well-known/* {
                reverse_proxy rybbit-backend:3001
            }
            handle {
                reverse_proxy rybbit-client:3002
            }
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile
    depends_on:
      - rybbit-client
      - rybbit-backend
    networks:
      - njorddeploy_net

  rybbit-backend:
    image: ghcr.io/rybbit-io/rybbit-backend:latest
    container_name: njorddeploy-rybbit-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=http://rybbit-clickhouse:8123
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{ RYBBIT_DB_PASSWORD }}
      - CLICKHOUSE_QUERY_PASSWORD={{ RYBBIT_DB_PASSWORD }}
      - POSTGRES_HOST=rybbit-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=analytics
      - POSTGRES_USER=frog
      - POSTGRES_PASSWORD={{ RYBBIT_DB_PASSWORD }}
      - REDIS_HOST=rybbit-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD={{ RYBBIT_DB_PASSWORD }}
      - BETTER_AUTH_SECRET={{ RYBBIT_AUTH_SECRET }}
      - BASE_URL=http://localhost:{{ RYBBIT_WEB_PORT }}
      - DISABLE_SIGNUP=false
      - DISABLE_TELEMETRY=true
      - CLUSTER_WORKERS=2
    depends_on:
      - rybbit-clickhouse
      - rybbit-postgres
      - rybbit-redis
    networks:
      - njorddeploy_net

  rybbit-client:
    image: ghcr.io/rybbit-io/rybbit-client:latest
    container_name: njorddeploy-rybbit-client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:{{ RYBBIT_WEB_PORT }}
      - NEXT_PUBLIC_DISABLE_SIGNUP=false
    depends_on:
      - rybbit-backend
    networks:
      - njorddeploy_net

  rybbit-postgres:
    image: postgres:17-alpine
    container_name: njorddeploy-rybbit-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=frog
      - POSTGRES_PASSWORD={{ RYBBIT_DB_PASSWORD }}
      - POSTGRES_DB=analytics
    volumes:
      - "{{ CONFIG_BASE_PATH }}/rybbit/postgres:/var/lib/postgresql/data"
    networks:
      - njorddeploy_net

  rybbit-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: njorddeploy-rybbit-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{ RYBBIT_DB_PASSWORD }}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - "{{ CONFIG_BASE_PATH }}/rybbit/clickhouse:/var/lib/clickhouse"
    networks:
      - njorddeploy_net

  rybbit-redis:
    image: redis:7-alpine
    container_name: njorddeploy-rybbit-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "{{ RYBBIT_DB_PASSWORD }}", "--appendonly", "yes"]
    volumes:
      - "{{ CONFIG_BASE_PATH }}/rybbit/redis:/data"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
