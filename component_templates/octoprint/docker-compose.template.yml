# status: "untested"
# last_tested_version: "none"
# platform_notes: "None"
# breaking_changes: "None"
services:
  octoprint:
    container_name: octoprint
    image: octoprint/octoprint:{{ component_version }}
    restart: unless-stopped
    ports:
      - "{{ PORT_OCTOPRINT | default(5000) }}:80"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/octoprint:/octoprint"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
