# status: "tested"
# last_tested_version: "latest"
# platform_notes: "Tested successfully on Proxmox VM (template 902)."
# breaking_changes: "None"
services:
  adminer:
    image: adminer:{{ component_version }}
    container_name: njorddeploy-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_WEB_PORT:-8084}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: "${ADMINER_DEFAULT_SERVER:-mariadb}"
      ADMINER_DESIGN: "${ADMINER_DESIGN:-pepa-linha}"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
