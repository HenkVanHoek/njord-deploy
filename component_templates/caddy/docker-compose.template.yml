# status: "tested"
# last_tested_version: "v2.11.4"
# platform_notes: "Tested on Proxmox LXC: docker (v2.11.4, 2026-08-15), podman (v2.11.4, 2026-08-15); Proxmox VM: docker (v2.11.4, 2026-08-15), podman (v2.11.4, 2026-08-15)."
# breaking_changes: "None"
services:
  caddy:
    image: caddy:{{ component_version }}
    container_name: caddy
    restart: unless-stopped
    ports:
      - "{{ CADDY_HTTP_PORT }}:80"
      - "{{ CADDY_HTTPS_PORT }}:443"
      - "{{ CADDY_HTTPS_PORT }}:443/udp"
    volumes:
      - "{{ DATA_ROOT }}/caddy/Caddyfile:/etc/caddy/Caddyfile"
      - "{{ DATA_ROOT }}/caddy/data:/data"
      - "{{ DATA_ROOT }}/caddy/config:/config"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
