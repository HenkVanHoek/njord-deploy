# status: "tested"
# last_tested_version: "4.33.0"
# platform_notes: "Tested on Proxmox LXC: docker (4.33.0, 2026-09-14), podman (4.33.0, 2026-09-14); Proxmox VM: docker (4.33.0, 2026-09-14), podman (4.33.0, 2026-09-14)."
# breaking_changes: none
services:
  diun:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-diun
    restart: unless-stopped
    environment:
      - TZ=UTC
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=2
      - DIUN_WATCH_SCHEDULE=0 0 * * *
      - DIUN_PROVIDERS_DOCKER=true
    volumes:
      - "{{ CONFIG_BASE_PATH }}/diun/data:/data"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
