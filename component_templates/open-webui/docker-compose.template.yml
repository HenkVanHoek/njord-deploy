# status: beta
# last_tested_version: main
# platform_notes: Requires sufficient CPU/GPU resources for Ollama models.
# breaking_changes: none
services:
  ollama:
    container_name: njorddeploy-ollama
    image: ollama/ollama:{{ OLLAMA_VERSION | default('latest') }}
    volumes:
      - "{{ CONFIG_BASE_PATH }}/ollama/data:/root/.ollama"
    networks:
      - njorddeploy_net
    user: "0:0"
    tty: true
    restart: unless-stopped

  open-webui:
    container_name: njorddeploy-open-webui
    image: "{{ image_name | default('ghcr.io/open-webui/open-webui') }}:{{ component_version | default('main') }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/open-webui/data:/app/backend/data"
    depends_on:
      - ollama
    ports:
      - "{{ OPEN_WEBUI_PORT | default('8080') }}:8080"
    environment:
      - "OLLAMA_BASE_URL=http://ollama:11434"
      - "WEBUI_SECRET_KEY={{ WEBUI_SECRET_KEY | default('njorddeploy_secret_key') }}"
      - "OPENAI_API_KEY={{ OPENAI_API_KEY | default('') }}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - njorddeploy_net
    user: "0:0"
    restart: unless-stopped

networks:
  njorddeploy_net:
    external: true
