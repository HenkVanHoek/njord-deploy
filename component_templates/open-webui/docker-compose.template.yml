# status: "tested"
# last_tested_version: "0.12.3"
# platform_notes: "Tested on Proxmox LXC: docker (0.12.3, 2026-10-20), podman (0.12.3, 2026-10-20); Proxmox VM: docker (0.12.3, 2026-10-20), podman (0.12.3, 2026-10-20)."
# breaking_changes: "None"
services:
  open-webui:
    container_name: njorddeploy-open-webui
    image: "{{ image_name | default('ghcr.io/open-webui/open-webui') }}:{{ component_version | default('main') }}"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/open-webui/data:/app/backend/data"
    ports:
      - "{{ OPEN_WEBUI_PORT | default('3000') }}:8080"
    environment:
      - "OLLAMA_BASE_URL={{ OLLAMA_BASE_URL | default('http://ollama:11434') }}"
      - "WEBUI_SECRET_KEY={{ WEBUI_SECRET_KEY | default('njorddeploy_secret_key_openwebui_2026') }}"
{% if OPENAI_API_BASE_URL %}
      - "OPENAI_API_BASE_URL={{ OPENAI_API_BASE_URL }}"
{% elif LITELLM_WEB_PORT or HOSTYOURAI_API_KEY %}
      - "OPENAI_API_BASE_URL=http://litellm:4000/v1"
{% endif %}
{% if OPENAI_API_KEY %}
      - "OPENAI_API_KEY={{ OPENAI_API_KEY }}"
{% elif LITELLM_MASTER_KEY %}
      - "OPENAI_API_KEY={{ LITELLM_MASTER_KEY | default('sk-njorddeploy-litellm-master-key') }}"
{% endif %}
{% if AUDIO_STT_ENGINE %}
      - "AUDIO_STT_ENGINE={{ AUDIO_STT_ENGINE }}"
{% elif SPEACHES_PORT %}
      - "AUDIO_STT_ENGINE=openai"
      - "AUDIO_STT_OPENAI_API_BASE_URL=http://speaches:8000/v1"
      - "AUDIO_STT_OPENAI_API_KEY=speaches"
      - "AUDIO_STT_MODEL={{ SPEACHES_MODEL | default('Systran/faster-whisper-small') }}"
{% endif %}
    networks:
      - njorddeploy_net
    restart: unless-stopped

networks:
  njorddeploy_net:
    external: true
