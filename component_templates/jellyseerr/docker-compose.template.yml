# status: "tested"
# last_tested_version: "22.18.0"
# platform_notes: "Tested on Proxmox LXC: docker (22.18.0, 2026-08-29), podman (22.18.0, 2026-08-29); Proxmox VM: docker (22.18.0, 2026-08-29), podman (22.18.0, 2026-08-29)."
# breaking_changes: none
services:
  jellyseerr:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-jellyseerr
    restart: unless-stopped
    environment:
      - "LOG_LEVEL=debug"
      - "TZ=Europe/Amsterdam"
    ports:
      - "{{ JELLYSEERR_WEB_PORT }}:5055"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/jellyseerr/config:/app/config"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
