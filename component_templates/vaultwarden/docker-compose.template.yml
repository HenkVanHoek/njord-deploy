#
# Docker Compose template for Vaultwarden
#
# Source: https://github.com/dani-garcia/vaultwarden
#

services:
  vaultwarden:
    image: vaultwarden/server:{{ component_version | default('latest') }}
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - '{{ CONFIG_BASE_PATH }}/vaultwarden:/data'
    ports:
      - '{{ VAULTWARDEN_WEB_PORT | default('8080') }}:80'
    environment:
      - ADMIN_TOKEN_HASH={{ VAULTWARDEN_ADMIN_TOKEN }}
      - SIGNUPS_ALLOWED={{ SIGNUPS_ALLOWED | default('true') }}
      - WEB_VAULT_ENABLED={{ WEB_VAULT_ENABLED | default('true') }}
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
