# status: "tested"
# last_tested_version: "v2.2.0"
# platform_notes: "Tested on Proxmox LXC: docker (v2.2.0, 2026-09-04), podman (v2.2.0, 2026-09-04); Proxmox VM: docker (v2.2.0, 2026-09-04), podman (v2.2.0, 2026-09-04)."
# breaking_changes: none
services:
  homepage:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-homepage
    environment:
      - "HOMEPAGE_ALLOWED_HOSTS={{ HOMEPAGE_ALLOWED_HOSTS | default('*', true) }}"
      - "PUID={{ PUID | default('1000', true) }}"
      - "PGID={{ PGID | default('1000', true) }}"
    ports:
      - "{{ HOMEPAGE_WEB_PORT }}:3000"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/homepage/config:/app/config"
    restart: unless-stopped
    user: "0:0"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
