# status: "tested"
# last_tested_version: "8.0.24-ls221"
# platform_notes: "Tested on Proxmox LXC: docker (8.0.24-ls221, 2026-08-15), podman (8.0.24-ls221, 2026-08-15); Proxmox VM: docker (8.0.24-ls221, 2026-08-15), podman (8.0.24-ls221, 2026-08-15)."
# breaking_changes: "None"
services:
  unifi-controller:
    container_name: unifi-controller
    image: lscr.io/linuxserver/unifi-controller:{{ component_version }}
    restart: unless-stopped
    environment:
      - "PUID={{ PUID | default('1000') }}"
      - "PGID={{ PGID | default('1000') }}"
      - "TZ={{ TZ | default('Europe/Amsterdam') }}"
      - "MEM_LIMIT=1024"
    ports:
      - "{{ PORT_UNIFI | default(8443) }}:8443"
      - "8080:8080"
      - "3478:3478/udp"
      - "10001:10001/udp"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/unifi-controller:/config"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
