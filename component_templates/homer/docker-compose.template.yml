# status: "untested"
# last_tested_version: "none"
# platform_notes: "None"
# breaking_changes: "None"
services:
  homer:
    container_name: njorddeploy-homer
    image: bcpierce/homer:{{ component_version }}
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - "{{DATA_ROOT}}/homer/assets:/www/assets"
    # Homer is simple and does not need PUID/PGID/TZ
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
