# status: "tested"
# last_tested_version: "10.11.18"
# platform_notes: "Tested on Proxmox LXC: docker (10.11.18, 2026-08-15), podman (10.11.18, 2026-08-15); Proxmox VM: docker (10.11.18, 2026-08-15), podman (10.11.18, 2026-08-15)."
# breaking_changes: "None"
services:
  nextcloud-db-dumper:
    image: databack/mysql-backup:{{ component_version }}
    container_name: nextcloud-db-dumper
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      TZ: "{{ TZ | default('Europe/Amsterdam') }}"
      DB_SERVER: "nextcloud-db"
      DB_USER: "{{ NEXTCLOUD_DB_USER | default('nextcloud', true) }}"
      DB_PASS: "{{ NEXTCLOUD_DB_PASSWORD | default('nextcloudpass', true) }}"
      DB_NAMES: "{{ NEXTCLOUD_DB_NAME | default('nextcloud', true) }}"
      DB_DUMP_CRON: "0 2 * * *"
      DB_DUMP_TARGET: "/backups"
      CLEANUP_OLDER_THAN: "3"
    networks:
      - njorddeploy_net
      - nextcloud-internal
    depends_on:
      - nextcloud-db
    volumes:
      - "{{ NEXTCLOUD_DB_DUMP_PATH | default(CONFIG_BASE_PATH ~ '/nextcloud/db_dumps', true) }}:/backups"

networks:
  njorddeploy_net:
    external: true
  nextcloud-internal:
    name: nextcloud-internal
