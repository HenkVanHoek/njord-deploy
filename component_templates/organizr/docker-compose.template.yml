# status: "tested"
# last_tested_version: "latest"
# platform_notes: "Tested on Proxmox LXC: docker (latest, 2026-08-15), podman (latest, 2026-08-15); Proxmox VM: docker (latest, 2026-08-15), podman (latest, 2026-08-15)."
# breaking_changes: "None"
services:
  organizr:
    container_name: njorddeploy-organizr
    image: organizr/organizr:{{ component_version }}
    restart: unless-stopped
    ports:
      - "{{ PORT_ORGANIZR | default(8095) }}:80"
    volumes:
      - "{{DATA_ROOT}}/organizr/config:/config"
    environment:
      - "PUID={{PUID}}"
      - "PGID={{PGID}}"
      - "TZ={{TZ}}"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
