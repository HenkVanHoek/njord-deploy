# status: "tested"
# last_tested_version: "v3.1.0"
# platform_notes: "Tested on Proxmox LXC: docker (24.14.0, 2026-09-05), podman (22.04, 2026-09-05); Proxmox VM: docker (24.14.0, 2026-09-05), podman (v3.1.0, 2026-09-05)."
# breaking_changes: none
services:
  nocodb:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-nocodb
    restart: unless-stopped
    ports:
      - "{{ NOCODB_WEB_PORT }}:8080"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/nocodb/data:/usr/app/data"
    user: "0:0"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
