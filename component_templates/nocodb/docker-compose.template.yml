# status: "tested"
# last_tested_version: "24.14.0"
# platform_notes: "Tested on Proxmox LXC: docker (24.14.0, 2026-09-05), podman (24.14.0, 2026-09-03); Proxmox VM: docker (24.14.0, 2026-09-03), podman (24.14.0, 2026-09-03)."
# breaking_changes: none
services:
  nocodb:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-nocodb
    restart: unless-stopped
    ports:
      - "{{ NOCODB_WEB_PORT }}:8080"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/nocodb/data:/usr/app/data"
    user: "0:0"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
