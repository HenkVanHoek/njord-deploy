# status: "tested"
# last_tested_version: "latest"
# platform_notes: "Tested successfully on Proxmox LXC."
# breaking_changes: "None"
services:
  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:{{ component_version }}
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "{{ PORT_NPM_ADMIN | default(8181) }}:81/tcp"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/npm/data:/data"
      - "{{ CONFIG_BASE_PATH }}/npm/letsencrypt:/etc/letsencrypt"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
