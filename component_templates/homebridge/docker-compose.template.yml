# status: "tested"
# last_tested_version: "2026-09-02"
# platform_notes: "Tested on Proxmox LXC: docker (2026-09-02, 2026-09-14), podman (2026-09-02, 2026-09-14); Proxmox VM: docker (2026-09-02, 2026-09-14), podman (2026-09-02, 2026-09-14)."
# breaking_changes: none
services:
  homebridge:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-homebridge
    restart: unless-stopped
{%- if CONTAINER_ENGINE == 'podman' %}
    ports:
      - "{{ HOMEBRIDGE_WEB_PORT | default('8581') }}:8581"
    networks:
      - njorddeploy_net
{%- else %}
    network_mode: host
{%- endif %}
    environment:
      - TZ=UTC
    volumes:
      - "{{ CONFIG_BASE_PATH }}/homebridge:/homebridge"
{%- if CONTAINER_ENGINE == 'podman' %}

networks:
  njorddeploy_net:
    external: true
{%- endif %}
