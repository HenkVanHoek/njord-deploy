# status: "tested"
# last_tested_version: "5.2.3"
# platform_notes: "Tested successfully on Proxmox VM (template 902)."
# breaking_changes: "None"
services:
  phpmyadmin:
    image: phpmyadmin:{{ component_version }}
    container_name: njorddeploy-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${PMA_HOST:-mariadb}
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-}
    ports:
      - "${PHPMYADMIN_WEB_PORT:-8083}:80"
    volumes:
      - "{{DATA_ROOT}}/phpmyadmin/config/config.inc.php:/etc/phpmyadmin/config.inc.php"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
