# status: "tested"
# last_tested_version: "2026.9.0"
# platform_notes: "Tested on Proxmox LXC: docker (2026.9.0, 2026-09-05), podman (2026.9.0, 2026-09-04); Proxmox VM: docker (2026.9.0, 2026-09-04), podman (2026.9.0, 2026-09-04)."
# breaking_changes: "None"
# templates/homeassistant/docker-compose.template.yml
services:
  homeassistant:
    container_name: njorddeploy-homeassistant
    image: ghcr.io/home-assistant/home-assistant:{{ component_version }}
    restart: unless-stopped
    volumes:
      - homeassistant_config:/config
{%- if CONTAINER_ENGINE == 'podman' %}
    ports:
      - "{{ HA_WEB_PORT | default('8123') }}:8123"
    networks:
      - njorddeploy_net
{%- else %}
    network_mode: host # Home Assistant often requires host network mode for discovery
{%- endif %}

volumes:
  homeassistant_config:
    name: njorddeploy-homeassistant-config

networks:
  njorddeploy_net:
    external: true
