# status: "tested"
# last_tested_version: "1.30.0"
# platform_notes: "Tested on Proxmox LXC: docker (1.30.0, 2026-09-14), podman (1.30.0, 2026-09-14); Proxmox VM: docker (1.30.0, 2026-09-14), podman (1.30.0, 2026-09-14)."
# breaking_changes: none
services:
  freshrss:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-freshrss
    restart: unless-stopped
    ports:
      - "{{ FRESHRSS_WEB_PORT }}:80"
    environment:
      - "TZ={{ TZ }}"
      - "CRON_MIN=*/20"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/freshrss/data:/var/www/FreshRSS/data"
      - "{{ CONFIG_BASE_PATH }}/freshrss/extensions:/var/www/FreshRSS/extensions"
    user: "0:0"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
