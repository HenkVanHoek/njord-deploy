# status: "tested"
# last_tested_version: "2.6.14"
# platform_notes: "Tested on Proxmox LXC: docker (2.6.14, 2026-08-29), podman (2.6.14, 2026-08-29); Proxmox VM: docker (2.6.14, 2026-08-29), podman (2.6.14, 2026-08-29)."
# breaking_changes: none
services:
  wallabag:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-wallabag
    restart: unless-stopped
    environment:
      - "SYMFONY__ENV__DATABASE_DRIVER=pdo_sqlite"
      - "SYMFONY__ENV__DOMAIN_NAME=http://localhost:8085"
    ports:
      - "{{ WALLABAG_WEB_PORT }}:80"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/wallabag/images:/var/www/wallabag/web/assets/images"
      - "{{ CONFIG_BASE_PATH }}/wallabag/data:/var/www/wallabag/data"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
