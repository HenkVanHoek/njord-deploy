<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Successful</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/njorddeploy-icon192x192.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/njorddeploy-icon192x192.png') }}" alt="NjordDeploy Logo" style="height: 100px;">
                    <h1 class="h2 mt-3">Deployment Successful</h1>
                    <p class="lead text-muted">Your selected services have been deployed.</p>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header">
                        <strong>Access Your Services</strong>
                    </div>
                    <div class="card-body">
                        {% if service_links %}
                            <ul class="list-group list-group-flush">
                                {% for service in service_links %}
                                    <li class="list-group-item d-flex justify-content-between align-items-center">
                                        <strong>{{ service.name }}</strong>
                                        <a href="{{ service.url }}" target="_blank" class="btn btn-outline-primary btn-sm">
                                            Open
                                        </a>
                                    </li>
                                {% endfor %}
                            </ul>
                        {% else %}
                            <p class="text-muted">No services with a web interface were deployed.</p>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
