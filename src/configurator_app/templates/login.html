<!-- src/configurator_app/templates/login.html -->
<!DOCTYPE html>
<html lang="en" data-theme="futuristic-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NjordDeploy</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/njorddeploy-style.css') }}?v=1.3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/configurator.css') }}?v=1.0">
    <script src="{{ url_for('static', filename='js/accessibility.js') }}?v=1.2"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark-bg-start, #0a1128) 0%, var(--dark-bg-end, #02040a) 100%);
            padding: 20px;
        }
        .auth-card {
            background-color: var(--glass-bg, rgba(15, 23, 42, 0.75));
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.12));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 176, 255, 0.2);
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
        }
        .form-control {
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: var(--brand-blue, #00b0ff);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 176, 255, 0.35);
        }
        .input-group-text {
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
        }
        .brand-glow {
            filter: drop-shadow(0 0 18px rgba(0, 176, 255, 0.45));
        }
    </style>
</head>
<body>

<div class="auth-card p-4 p-md-5">
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/njorddeploy-icon192x192.png') }}"
             alt="NjordDeploy Logo"
             width="64"
             height="64"
             class="brand-glow rounded mb-3">
        <h2 class="h4 fw-bold text-white mb-1">Sign In to NjordDeploy</h2>
        <p class="text-muted small">Enter your credentials to manage self-hosted nodes &amp; stacks.</p>
    </div>

    <div id="login-alert" class="alert d-none shadow-sm mb-4" role="alert"></div>

    <form id="njord-login-form">
        <div class="mb-3">
            <label for="login-username" class="form-label small fw-bold text-light">
                <i class="fa-solid fa-user me-1 text-primary"></i> Username
            </label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text"
                       class="form-control"
                       id="login-username"
                       name="username"
                       required
                       autocomplete="username"
                       placeholder="Enter username"
                       autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="login-password" class="form-label small fw-bold text-light">
                <i class="fa-solid fa-lock me-1 text-primary"></i> Password
            </label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password"
                       class="form-control"
                       id="login-password"
                       name="password"
                       required
                       autocomplete="current-password"
                       placeholder="Enter password">
                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="login-password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 fw-bold shadow">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
        <span class="text-muted small">Need an account? </span>
        <a href="/register" class="text-primary fw-bold small text-decoration-none">Sign Up</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}?v=1.0"></script>
</body>
</html>
