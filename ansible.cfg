[defaults]
remote_tmp = ~/.ansible/tmp
local_tmp = /tmp/.ansible-local
host_key_checking = False
retry_files_enabled = False
timeout = 30
pipelining = True

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=30
