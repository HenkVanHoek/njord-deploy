---
- name: Deploy NjordDeploy Services
  hosts: all
  become: true
  vars:
    ansible_become_timeout: 60
    # Container engine: 'docker' (default) or 'podman'
    container_engine: "{{ engine | default(container_engine | default('docker')) | lower }}"
    # Compose command: 'docker compose' for Docker, 'podman-compose' for Podman
    compose_cmd: "{{ 'podman-compose' if (engine | default(container_engine | default('docker')) | lower) == 'podman' else 'docker compose' }}"
    # Destination path on the target for all configuration
    project_config_dir: "/opt/njorddeploy"
    # Map kernel architecture to Debian package architecture
    debian_architecture_map:
      x86_64: "amd64"
      aarch64: "arm64"
      armv7l: "armhf"
      armv6l: "armhf"
    # Map distribution names to Docker repository folder names
    docker_distribution_map:
      debian: "debian"
      ubuntu: "ubuntu"
      raspbian: "raspbian"
      "raspberry pi os": "debian"
      mx: "debian"
      "mx linux": "debian"
      "mx-linux": "debian"
      "linux mint": "ubuntu"
      "pop!_os": "ubuntu"

  tasks:
    - name: Pre flight check Ensure at least 2GB of free disk space is available
      ansible.builtin.assert:
        that:
          - item.size_available > 2147483648  # 2 GB in bytes
        fail_msg: >-
          Deployment aborted: The target host does not have enough free disk space on
          {{ item.mount }}. Please clean up the device.
        success_msg: "Disk space check passed on {{ item.mount }}."
      loop: "{{ ansible_mounts }}"
      when: item.mount == '/'

    # --- WAIT FOR SYSTEM LOCKS ---
    - name: Wait for cloud-init and background apt/dpkg locks to clear
      ansible.builtin.shell: |
        if command -v cloud-init >/dev/null 2>&1; then
          cloud-init status --wait || true
        fi
        systemctl stop apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
        systemctl disable --now apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
        while pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1 || (command -v fuser >/dev/null 2>&1 && fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1); do
          sleep 2
        done
      changed_when: false

    # --- DOCKER ENGINE PROVISIONING ---
    - name: Ensure prerequisites for Docker repository are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        cache_valid_time: 3600
        lock_timeout: 600
      when: container_engine == 'docker' and not (skip_engine_provisioning | default(false) | bool)

    - name: Ensure directory for Docker archive keyring exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: container_engine == 'docker' and not (skip_engine_provisioning | default(false) | bool)

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_distribution_map[ansible_distribution | lower] | default(ansible_distribution | lower) }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: container_engine == 'docker' and not (skip_engine_provisioning | default(false) | bool)

    - name: Add Docker repository to Apt sources
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ debian_architecture_map[ansible_architecture] | default(ansible_architecture) }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ docker_distribution_map[ansible_distribution | lower] | default(ansible_distribution | lower) }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: container_engine == 'docker' and not (skip_engine_provisioning | default(false) | bool)

    - name: Ensure Docker CE and Compose plugin are installed
      ansible.builtin.apt:
        name:
          - docker-ce               # Official Docker CE
          - docker-ce-cli           # Official Docker CE CLI
          - containerd.io           # Official Containerd
          - docker-compose-plugin   # Official Docker Compose V2 plugin
        state: present
        cache_valid_time: 3600
        lock_timeout: 600
      when: container_engine == 'docker' and not (skip_engine_provisioning | default(false) | bool)

    - name: Ensure SSH user is in docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      when: container_engine == 'docker' and not (skip_engine_provisioning | default(false) | bool)

    # --- PODMAN ROOTLESS PROVISIONING ---
    - name: Ensure Podman and Compose packages are installed
      ansible.builtin.apt:
        name:
          - podman
          - podman-compose
          - slirp4netns
          - uidmap
          - dbus-user-session
          - curl
          - ca-certificates
        state: present
        cache_valid_time: 3600
        lock_timeout: 600
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Configure unprivileged port start for rootless Podman (DNS 53 and HTTP 80/443)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-podman-ports.conf
        content: "net.ipv4.ip_unprivileged_port_start=53\n"
        mode: "0644"
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Apply sysctl configuration for Podman
      ansible.builtin.command:
        cmd: "sysctl -p /etc/sysctl.d/99-podman-ports.conf"
      changed_when: false
      failed_when: false
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Enable user lingering for rootless Podman session persistence
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ ansible_user }}"
      changed_when: false
      failed_when: false
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Configure unqualified search registries for Podman
      ansible.builtin.copy:
        dest: /etc/containers/registries.conf.d/00-default-registries.conf
        content: |
          unqualified-search-registries = ["docker.io"]
          short-name-mode = "disabled"
        mode: "0644"
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Configure events logger for rootless Podman
      ansible.builtin.copy:
        dest: /etc/containers/containers.conf
        content: |
          [engine]
          events_logger = "file"
        mode: "0644"
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Enable and start Podman Docker-compatible API socket service
      ansible.builtin.systemd:
        name: podman.socket
        enabled: yes
        state: started
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Ensure Podman socket directory is traversable
      ansible.builtin.file:
        path: /run/podman
        state: directory
        mode: "0755"
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Ensure Podman socket is accessible
      ansible.builtin.file:
        path: /run/podman/podman.sock
        mode: "0666"
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    - name: Create Docker socket symlink to Podman socket
      ansible.builtin.file:
        src: /run/podman/podman.sock
        dest: /var/run/docker.sock
        state: link
        force: yes
      when: container_engine == 'podman' and not (skip_engine_provisioning | default(false) | bool)

    # --- DIRECTORY & FILE DEPLOYMENT ---
    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_config_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure data root directory exists with write permissions
      ansible.builtin.file:
        path: "{{ data_root | default('/opt/njorddeploy/data') }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0777"

    - name: Copy all deployment files to the target (including .env and config folders)
      ansible.builtin.copy:
        # trailing slash is required to copy the content of the folder (/)
        src: "{{ local_output_path }}/"
        dest: "{{ project_config_dir }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "preserve"

    - name: Ensure permissive write permissions on deployment directories
      ansible.builtin.file:
        path: "{{ project_config_dir }}"
        state: directory
        recurse: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "u=rwX,g=rwX,o=rwX"

    - name: Perform Clean Install (Stop containers and remove volumes for selected components)
      ansible.builtin.command:
        cmd: "{{ compose_cmd }} rm -f -s -v {{ item }}"
        chdir: "{{ project_config_dir }}"
      become: "{{ (container_engine == 'podman' and (podman_rootful | default(false))) | bool }}"
      loop: "{{ components_to_clean | default([]) }}"
      when: components_to_clean is defined and components_to_clean | length > 0
      # Mitigation: String "true" aligns types to prevent suspicious type mismatch
      changed_when: "true"

    # --- CLI-BASED CONTAINER OPERATIONS ---
    - name: Ensure Docker daemon is active and running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
      when: container_engine == 'docker'

    - name: Ensure systemd-run wrapper is configured for Podman in unprivileged containers
      ansible.builtin.shell: |
        if [ -f /usr/bin/systemd-run ] && [ ! -f /usr/bin/systemd-run.real ]; then
          mv /usr/bin/systemd-run /usr/bin/systemd-run.real
          printf '#!/bin/bash\nif [ "$(id -u)" -eq 0 ]; then\n  args=()\n  for arg in "$@"; do\n    if [ "$arg" != "--user" ]; then args+=("$arg"); fi\n  done\n  exec /usr/bin/systemd-run.real "${args[@]}"\nelse\n  exec /usr/bin/systemd-run.real "$@"\nfi\n' > /usr/bin/systemd-run
          chmod +x /usr/bin/systemd-run
        fi
      when: container_engine == 'podman'
      changed_when: false

    - name: Ensure NjordDeploy network exists
      ansible.builtin.shell: |
        if [ "{{ container_engine }}" = "podman" ]; then
          for net in njorddeploy_net nextcloud-internal; do
            if podman network inspect $net 2>/dev/null | grep -q '"dns_enabled": false'; then
              podman network rm -f $net 2>/dev/null || true
            fi
            podman network create $net 2>/dev/null || true
          done
          if [ "{{ (podman_rootful | default(false)) | bool }}" = "False" ] && [ -n "{{ ansible_user }}" ]; then
            su - {{ ansible_user }} -c 'for net in njorddeploy_net nextcloud-internal; do if podman network inspect $net 2>/dev/null | grep -q "\"dns_enabled\": false"; then podman network rm -f $net 2>/dev/null || true; fi; podman network create $net 2>/dev/null || true; done'
          fi
        else
          docker network create njorddeploy_net 2>/dev/null || true
          docker network create nextcloud-internal 2>/dev/null || true
        fi
      changed_when: false

    - name: Pull latest service images (Docker)
      ansible.builtin.command:
        cmd: "docker compose pull --ignore-buildable"
        chdir: "{{ project_config_dir }}"
      when: container_engine == 'docker'
      changed_when: "true"

    - name: Pull latest service images (Podman)
      ansible.builtin.command:
        cmd: "podman-compose pull"
        chdir: "{{ project_config_dir }}"
      environment: "{{ {'XDG_RUNTIME_DIR': '/run/user/' ~ (ansible_effective_user_id | default(ansible_user_uid | default('1000')))} if not (podman_rootful | default(false) | bool) else {} }}"
      become: "{{ (container_engine == 'podman' and (podman_rootful | default(false))) | bool }}"
      when: container_engine == 'podman'
      changed_when: "true"

    - name: Ensure container volume mount host directories exist
      ansible.builtin.shell: |
        if [ -f "{{ project_config_dir }}/docker-compose.yml" ]; then
          grep -E '^\s*-\s+["'\''"]?(\.\.?/|/|~)' "{{ project_config_dir }}/docker-compose.yml" | sed -E 's/^\s*-\s+["'\''"]?([^:]+):.*/\1/' | while read -r host_path; do
            clean_path=$(echo "$host_path" | tr -d '"' | tr -d "'")
            if [ -n "$clean_path" ]; then
              # Never chmod or modify permissions on critical OS system paths or rootfs
              case "$clean_path" in
                /|/etc|/etc/*|/sys|/sys/*|/proc|/proc/*|/dev|/dev/*|/run|/run/*|/var/run|/var/run/*|/var/lib/docker|/var/lib/docker/*|/boot|/boot/*|/lib|/lib/*|/usr|/usr/*|/root|/root/*)
                  continue
                  ;;
                /*) target_dir="$clean_path" ;;
                ../*) target_dir="{{ project_config_dir }}/$clean_path" ;;
                ./*) target_dir="{{ project_config_dir }}/${clean_path#./}" ;;
                *) target_dir="{{ project_config_dir }}/$clean_path" ;;
              esac
              # Only operate if path is located under project dir or explicit safe custom data root
              mkdir -p "$target_dir" 2>/dev/null || true
              chmod 777 "$target_dir" 2>/dev/null || true
              chown {{ ansible_user }}:{{ ansible_user }} "$target_dir" 2>/dev/null || true
              if [ "{{ container_engine }}" = "podman" ] && [ -n "{{ ansible_user }}" ]; then
                su - {{ ansible_user }} -c "podman unshare chmod 777 '$target_dir' 2>/dev/null || true"
              fi
            fi
          done
          # Defensive guard: Ensure SSH daemon private host keys remain strictly 0600
          chmod 600 /etc/ssh/ssh_host_*_key 2>/dev/null || true
        fi
      become: true
      changed_when: false

    - name: Free host port 53 if DNS component is deployed
      ansible.builtin.shell: |
        if grep -q -E '53:53/(tcp|udp)|853:853/(tcp|udp)|5380:5380' "{{ project_config_dir }}/docker-compose.yml" 2>/dev/null; then
          printf "[Resolve]\nDNSStubListener=no\nMulticastDNS=no\nLLMNR=no\n" > /etc/systemd/resolved.conf 2>/dev/null || true
          chmod 000 /lib/systemd/systemd-resolved /usr/lib/systemd/systemd-resolved 2>/dev/null || true
          pkill -9 -f systemd-resolve 2>/dev/null || true
          pkill -9 -f dnsmasq 2>/dev/null || true
          pkill -9 -f aardvark-dns 2>/dev/null || true
          pkill -9 -f rootlessport 2>/dev/null || true
          systemctl stop systemd-resolved systemd-resolved.socket 2>/dev/null || true
          systemctl disable --now systemd-resolved systemd-resolved.socket 2>/dev/null || true
          systemctl mask systemd-resolved systemd-resolved.socket 2>/dev/null || true
          chattr -i /etc/resolv.conf 2>/dev/null || true
          rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf
          chattr +i /etc/resolv.conf 2>/dev/null || true
          fuser -k 53/udp 53/tcp 2>/dev/null || true
          for pid in $(ss -lpun 'sport = :53' 2>/dev/null | grep -oP 'pid=\K[0-9]+' ; ss -lptn 'sport = :53' 2>/dev/null | grep -oP 'pid=\K[0-9]+'); do
            kill -9 "$pid" 2>/dev/null || true
          done
          sleep 1
        fi
      become: true
      changed_when: false
      failed_when: false

    - name: Deploy services with Compose
      ansible.builtin.command:
        cmd: "{{ compose_cmd }} up -d"
        chdir: "{{ project_config_dir }}"
      environment: "{{ {'XDG_RUNTIME_DIR': '/run/user/' ~ (ansible_effective_user_id | default(ansible_user_uid | default('1000')))} if not (podman_rootful | default(false) | bool) else {} }}"
      become: "{{ (container_engine == 'podman' and (podman_rootful | default(false))) | bool }}"
      # Mitigation: String "true" aligns types to prevent suspicious type mismatch
      changed_when: "true"

    - name: Ensure all compose containers are started
      ansible.builtin.shell: |
        if [ "{{ container_engine }}" = "podman" ]; then
          created_c=$(podman ps -a -q --filter status=created 2>/dev/null)
          if [ -n "$created_c" ]; then
            podman start $created_c 2>/dev/null || true
          fi
        fi
      environment: "{{ {'XDG_RUNTIME_DIR': '/run/user/' ~ (ansible_effective_user_id | default(ansible_user_uid | default('1000')))} if not (podman_rootful | default(false) | bool) else {} }}"
      become: "{{ (container_engine == 'podman' and (podman_rootful | default(false))) | bool }}"
      changed_when: false

    - name: Register Jitsi Meet moderator user if configured
      ansible.builtin.shell: |
        if [ -f {{ project_config_dir }}/.env ]; then
          JITSI_MEET_USER=$(grep "^JITSI_MEET_USER=" {{ project_config_dir }}/.env | cut -d= -f2-)
          JITSI_MEET_PASSWORD=$(grep "^JITSI_MEET_PASSWORD=" {{ project_config_dir }}/.env | cut -d= -f2-)
          if [ -n "$JITSI_MEET_USER" ] && [ -n "$JITSI_MEET_PASSWORD" ]; then
            if {{ container_engine }} ps | grep -q njorddeploy-jitsi-prosody; then
              {{ container_engine }} exec njorddeploy-jitsi-prosody prosodyctl --config /config/prosody.cfg.lua register $JITSI_MEET_USER meet.jitsi $JITSI_MEET_PASSWORD 2>&1 | grep -E "created|exists"
            fi
          fi
        fi
      register: jitsi_register_out
      changed_when: "'created' in jitsi_register_out.stdout"
      failed_when: false

    - name: Restart specifically requested components
      ansible.builtin.command:
        cmd: "{{ compose_cmd }} restart {{ item }}"
        chdir: "{{ project_config_dir }}"
      become: "{{ (container_engine == 'podman' and (podman_rootful | default(false))) | bool }}"
      loop: "{{ components_to_restart | default([]) }}"
      when: components_to_restart is defined and components_to_restart | length > 0
      # Mitigation: String "true" aligns types to prevent suspicious type mismatch
      changed_when: "true"

    - name: Fetch Portainer container status
      ansible.builtin.command:
        cmd: "{{ container_engine }} ps -a --filter name=njorddeploy-portainer --format '{{ '{{' }} .Names {{ '}}' }}'"
      register: portainer_status
      changed_when: "false"
      failed_when: false

    - name: Extract Portainer setup token from logs
      ansible.builtin.command:
        cmd: "{{ container_engine }} logs njorddeploy-portainer"
      register: portainer_logs
      until: "'setup_token' in (portainer_logs.stdout + '\n' + portainer_logs.stderr)"
      retries: 10
      delay: 2
      changed_when: "false"
      failed_when: false
      when: "'njorddeploy-portainer' in portainer_status.stdout"

    - name: Display Portainer setup token if present
      ansible.builtin.debug:
        msg: "PORTAINER SETUP TOKEN: {{ item }}"
      loop: "{{ ((portainer_logs.stdout | default('') + '\n' + portainer_logs.stderr | default('')) | split('\n')) if (portainer_logs is not skipped) else [] }}"
      when:
        - portainer_logs is not skipped
        - "'setup_token' in item"
