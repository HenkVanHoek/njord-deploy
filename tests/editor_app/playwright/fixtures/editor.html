<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>NjordDeploy Editor - Test Fixture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/material-darker.min.css">
    <!--suppress CssUnusedSymbol -->
    <style>
        body, #main-container, #sidebar, #editor-pane {
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            min-width: 200px;
            max-width: 500px;
            width: 280px;
            resize: horizontal;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }
        #drag-handle {
            width: 5px;
            cursor: col-resize;
            background: #444;
        }
        #component-list-container {
            flex-grow: 1;
            overflow-y: auto;
        }
        .tab-dirty::after {
            content: ' *';
            color: #ffc107;
        }
    </style>
</head>
<body>

<div class="d-flex" id="main-container">
    <!-- Sidebar -->
    <div id="sidebar" class="bg-dark-subtle p-3 d-flex flex-column">
        <h4 class="mb-3">Components</h4>
        <div id="sidebar-controls" class="mb-3">
             <div class="d-flex">
                <button id="create-new-btn" class="btn btn-sm btn-outline-success me-2 flex-grow-1">New</button>
                <button id="manage-groups-btn" class="btn btn-sm btn-outline-secondary flex-grow-1">Manage Groups</button>
            </div>
        </div>
        <div id="component-list-container">
            <div id="component-list" class="list-group"></div>
        </div>
    </div>

    <div id="drag-handle"></div>

    <!-- Main Editor Pane -->
    <div id="editor-pane" class="flex-grow-1 p-3 d-flex flex-column">
        <div id="placeholder-text" class="text-center text-muted align-self-center">
            <p>Select a component to begin editing.</p>
        </div>
        <div id="editor-content" class="d-none d-flex flex-column h-100">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                <h2 id="editor-title">Component Title</h2>
                <div class="d-flex align-items-center">
                    <button id="generate-hash-btn" class="btn btn-sm btn-outline-warning me-3"><i class="bi bi-shield-lock"></i> Generate Hash</button>
                    <button id="delete-component-btn" class="btn btn-sm btn-outline-danger me-2"><i class="bi bi-trash"></i> Delete</button>
                    <button id="discard-changes-btn" class="btn btn-sm btn-secondary me-2 d-none"><i class="bi bi-arrow-counterclockwise"></i> Discard</button>
                    <button id="save-changes-btn" class="btn btn-primary" disabled><i class="bi bi-save"></i> Save All Changes</button>
                </div>
            </div>

            <div id="feedback-alert"></div>

            <!-- Tabs -->
            <ul class="nav nav-tabs" id="editorTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#metadata-pane" type="button">Metadata</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#variables-pane" type="button">Variables</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#template-pane" type="button">Template</button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content flex-grow-1 mt-3 d-flex flex-column">
                <div class="tab-pane fade show active h-100" id="metadata-pane" role="tabpanel"></div>
                <div class="tab-pane fade h-100" id="variables-pane" role="tabpanel" style="overflow-y: auto;"></div>
                <div class="tab-pane fade h-100 d-flex flex-column" id="template-pane" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <!--suppress HtmlFormInputWithoutLabel -->
                        <select id="theme-selector" class="form-select form-select-sm w-auto">
                            <option value="material-darker">Material Darker</option>
                        </select>
                        <div>
                            <button id="import-template-btn" class="btn btn-sm btn-outline-secondary me-2">Import</button>
                            <input type="file" id="template-file-input" style="display: none;" accept=".yml,.yaml">
                            <button id="validate-template-btn" class="btn btn-sm btn-outline-info"><i class="bi bi-check-circle"></i> Validate Template</button>
                        </div>
                    </div>
                    <div id="editor-wrapper" class="flex-grow-1" style="height: 100%; border: 1px solid #444;">
                        <!--suppress HtmlFormInputWithoutLabel -->
                        <textarea id="template-editor"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- All Modals -->
<div class="modal fade" id="create-component-modal" tabindex="-1">...</div>
<div class="modal fade" id="manage-groups-modal" tabindex="-1">...</div>
<div class="modal fade" id="hashGeneratorModal" tabindex="-1">...</div>
<div class="modal fade" id="unsavedChangesModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Unsaved Changes</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>You have unsaved changes. Do you want to save them before continuing?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="discard-and-continue-btn">Discard and Continue</button>
                <button type="button" class="btn btn-primary" id="save-and-continue-btn">Save and Continue</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" integrity="sha384-ZYmwuq4n2gOcNxMSiJ6jyTj+BbIrilr7p6dlq6q5nmSWKmsH9UU4K1qqjycMkfmR" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js" integrity="sha384-9q49Jm3hZMwxEMLImsxPxLiaptHpFz1PVa26Dg6SVIO+rj5kx0cgOM2+4ikKJFH9" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" integrity="sha384-BSxuMLxX+FCbTdYec3TbXlnMGEEM2QXTFdtDaveen71o+jswm2J36+xFqp8k4VHM" crossorigin="anonymous"></script>

<!-- Scripts Under Test -->
<script src="/src/editor_app/static/ui_render_utils.js" type="module"></script>
<script src="/src/editor_app/static/editor.v2.js" type="module"></script>

</body>
</html>
