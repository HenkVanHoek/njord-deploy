# .github/workflows/release.yml

name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# SECURITY FIRST: Restrict default GITHUB_TOKEN permissions to read-only
permissions:
  contents: read

jobs:
  build-executables:
    name: Build for ${{ matrix.os-name }}
    runs-on: ${{ matrix.os-runner }}
    strategy:
      matrix:
        include:
          - os-name: Linux
            os-runner: ubuntu-22.04
          - os-name: macOS
            os-runner: macos-latest
          - os-name: Windows
            os-runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # MODERNIZED CACHING: Tell pip cache to depend on the pyproject.toml
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install pyinstaller

      - name: Run tests with Pytest
        run: pytest

      - name: Build executables with PyInstaller
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller NjordDeployConfigurator.spec
          pyinstaller NjordDeployEditor.spec

      - name: Package executables
        shell: bash
        run: |
          mkdir -p artifact
          if [ "${{ matrix.os-name }}" = "Windows" ]; then
            cp dist/NjordDeployConfigurator.exe artifact/NjordDeployConfigurator.exe
            cp dist/NjordDeployEditor.exe artifact/NjordDeployEditor.exe
          else
            cp dist/NjordDeployConfigurator artifact/NjordDeployConfigurator
            cp dist/NjordDeployEditor artifact/NjordDeployEditor
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os-name }}
          path: artifact/

  release:
    name: Create GitHub Release
    needs: build-executables
    runs-on: ubuntu-latest
    # ROBUSTNESS: Prevent accidental branch-named release creation on manual triggers
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: Zip installers for release
        run: |
          cd installers
          zip -r ../NjordDeploy-Windows.zip NjordDeployConfigurator.exe NjordDeployEditor.exe
          zip -r ../NjordDeploy-Linux.zip NjordDeployConfigurator NjordDeployEditor
          zip -r ../NjordDeploy-macOS.zip NjordDeployConfigurator NjordDeployEditor
          cd ..

      - name: Upload assets to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: "NjordDeploy-*.zip"
          file_glob: true
          overwrite: true
