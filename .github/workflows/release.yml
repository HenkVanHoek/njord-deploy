# .github/workflows/release.yml

name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# SECURITY FIRST: Restrict default GITHUB_TOKEN permissions to read-only
permissions:
  contents: read

jobs:
  build-executables:
    name: Build for ${{ matrix.os-name }}
    runs-on: ${{ matrix.os-runner }}
    strategy:
      matrix:
        include:
          - os-name: Linux
            os-runner: ubuntu-latest
            artifact-name: NjordDeploy-Linux
          - os-name: macOS
            os-runner: macos-latest
            artifact-name: NjordDeploy-macOS
          - os-name: Windows
            os-runner: windows-latest
            artifact-name: NjordDeploy-Windows.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # MODERNIZED CACHING: Tell pip cache to depend on the pyproject.toml
          cache: 'pip'
          cache-dependency-path: pyproject.toml



      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install pyinstaller

      - name: Run tests with Pytest
        run: pytest

      - name: Build the executable with PyInstaller
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller NjordDeployInstaller.spec

      - name: Package the executable
        shell: bash
        # ROBUSTNESS: Explicit check avoids wildcards to prevent shell globbing errors
        run: |
          mkdir -p artifact
          echo "=== Listing dist/ contents ==="
          ls -la dist/ || true
          echo "=== Finding all files in workspace matching NjordDeploy ==="
          find . -maxdepth 4 -name "*NjordDeploy*" || true
          if [ -f "dist/NjordDeployInstaller.exe" ]; then
            mv "dist/NjordDeployInstaller.exe" "artifact/${{ matrix.artifact-name }}"
          elif [ -f "dist/NjordDeployInstaller" ]; then
            mv "dist/NjordDeployInstaller" "artifact/${{ matrix.artifact-name }}"
          elif [ -d "dist/NjordDeployInstaller.app" ]; then
            echo "Found .app bundle instead of standalone binary, copying internal executable..."
            cp "dist/NjordDeployInstaller.app/Contents/MacOS/NjordDeployInstaller" "artifact/${{ matrix.artifact-name }}"
          else
            echo "ERROR: Pyinstaller executable not found in dist/"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os-name }}
          path: artifact/

  release:
    name: Create GitHub Release
    needs: build-executables
    runs-on: ubuntu-latest
    # ROBUSTNESS: Prevent accidental branch-named release creation on manual triggers
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: Zip installers for release
        run: |
          zip -j NjordDeploy-Windows.zip installers/NjordDeploy-Windows.exe
          zip -j NjordDeploy-macOS.zip installers/NjordDeploy-macOS
          zip -j NjordDeploy-Linux.zip installers/NjordDeploy-Linux

      - name: Upload assets to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: "NjordDeploy-*.zip"
          file_glob: true
          overwrite: true
