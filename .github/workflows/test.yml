# .github/workflows/test.yml

name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

# SECURITY FIRST: Restrict default GITHUB_TOKEN permissions to read-only
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checks out the repository's code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Sets up the specified Python version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # MODERNIZED CACHING: Point to pyproject.toml
          cache-dependency-path: pyproject.toml

      # Step 3: Install critical system-level dependencies for the tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap sshpass

      # Step 4: Install Python packages from pyproject.toml.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      # Step 5: (Optional but highly recommended) Run Linters / Formatters
      # - name: Run Linting Checks
      #   run: |
      #     black --check src/ tests/
      #     flake8 src/ tests/

      # Step 6: Run the Pytest test suite.
      - name: Run Pytest tests
        run: pytest
