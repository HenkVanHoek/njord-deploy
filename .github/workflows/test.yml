# .github/workflows/test.yml

name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

# SECURITY FIRST: Restrict default GITHUB_TOKEN permissions to read-only
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checks out the repository's code (SHA-pinned).
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Step 2: Sets up the specified Python version (SHA-pinned).
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # MODERNIZED CACHING: Point to pyproject.toml
          cache-dependency-path: pyproject.toml

      # Step 3: Install critical system-level dependencies for the tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap sshpass

      # Step 4: Install Python packages from pyproject.toml.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test] ruff

      # Step 5: Ruff Security SAST Gate (Sprint 3)
      - name: Run Ruff Security SAST Gate
        run: |
          ruff check --select S102,S301,S307,S506,S602,S608,S701 . --exclude tests,scripts_oud,docker

      # Step 6: Run the Pytest test suite.
      - name: Run Pytest tests
        run: pytest
