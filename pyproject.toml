[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line_length = 88

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
norecursedirs = ["scripts", "test_scanner.py"]
addopts = "--ignore=test_scanner.py"
# START OF FIX: Use precise regex filter to ignore external 'crypt' deprecation warning
filterwarnings = [
    "ignore:.*'crypt' is deprecated and slated for removal in Python 3.13.*:DeprecationWarning",
    "ignore::DeprecationWarning:passlib.handlers.argon2"
]
# END OF FIX: Use precise regex filter to ignore external 'crypt' deprecation warning

[project]
name = "NjordDeploy"
version = "0.6.0"
description = "A project to self-host services on a Raspberry Pi."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "waitress>=3.0.2",
    "python-dotenv>=1.2.3",
    "python-nmap>=0.7.1",
    "psutil>=6.0.0",
    "PyYAML>=6.0.2",
    "ansible-runner>=2.4.0",
    "jinja2>=3.1.6",
    "platformdirs>=4.0.0",
    "requests>=2.34.2",
    "keyring>=24.0.0",
    "appdirs>=1.4.4",
    "paramiko>=5.0.0",
    "argon2-cffi>=23.1.0",
    "passlib>=1.7.4",
    "cryptography>=50.0.1",
    "bcrypt>=4.2.0",
    "openai>=1.50.0",
    "stripe>=15.6.0"
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*egg-info*"]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "bump-my-version",
    "pre-commit",
    "black",
    "isort",
    "flake8",
    "bandit[toml]",
    "pyinstaller",
]

[tool.bumpversion]
current_version = "0.6.0"
commit = true
tag = true
commit_args = "--no-verify"
message = "chore(release): bump version to {new_version}"
tag_name = "v{new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(-(?P<release>[a-zA-Z0-9]+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}",
    "{major}.{minor}.{patch}"
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.mypy.overrides]]
module = [
    "utils.*",
    "managers.*",
    "configurator_app.*",
    "editor_app.*",
    "onvif.*",
    "appdirs",
    "ansible_runner",
    "passlib.*",
    "pi_scanner",
    "waitress.*",
    "gunicorn.*",
    "run_service",
    "requests.*",
    "node_scanner",
    "scripts.*",
    "proxmox_gui",
    "cli.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
